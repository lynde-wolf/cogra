# pip install pre-commit && pre-commit install   (runs on every git commit)
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=3000]          # the scan fonts are about 2.3 MB each
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
        exclude: (mathjax|_site)/
      - id: trailing-whitespace
        exclude: (mathjax|_site)/
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.28.0
    hooks:
      - id: gitleaks
